<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Prévisions fines Vercors/Diois</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
  header { background: #1a3c5e; color: white; padding: 1rem; text-align: center; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 0.3rem 0 0; font-size: 0.85rem; opacity: 0.85; }
  .controls { text-align: center; padding: 0.8rem; background: white; }
  .controls button {
    padding: 0.5rem 1.2rem; margin: 0 0.3rem; border: 1px solid #1a3c5e;
    background: white; color: #1a3c5e; border-radius: 4px; cursor: pointer; font-weight: bold;
  }
  .controls button.active { background: #1a3c5e; color: white; }
  #map { height: 65vh; width: 100%; position: relative; }
  .hover-value {
    position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: white;
    padding: 0.4rem 0.7rem; border-radius: 4px; font-size: 0.85rem; z-index: 1000; pointer-events: none;
    display: none;
  }
  .isoligne { fill: none; stroke: rgba(0,0,0,0.35); stroke-width: 0.7; }
  .isoligne-label { font-size: 0.65rem; fill: #333; }
  table { width: 100%; border-collapse: collapse; background: white; margin-top: 0.5rem; }
  th, td { padding: 0.5rem 0.8rem; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  th { background: #eef2f6; cursor: pointer; user-select: none; }
  th:hover { background: #dde5ec; }
  th.sorted::after { content: " ▾"; font-size: 0.7rem; }
  td.temp { text-align: right; font-variant-numeric: tabular-nums; font-weight: bold; color: #fff; text-shadow: 0 0 2px rgba(0,0,0,0.5); }
  .legend { font-size: 0.8rem; color: #555; text-align: center; padding: 0.3rem; }
</style>
</head>
<body>

<header>
  <h1>Prévisions fines Vercors / Diois</h1>
  <p id="date-info">Chargement…</p>
</header>

<div class="controls">
  <button id="btn-tn" class="active">Température min</button>
  <button id="btn-tx">Température max</button>
</div>
<p class="legend" id="date-tn" style="display:block;"></p>
<p class="legend" id="date-tx" style="display:none;"></p>

<div id="map">
  <div class="hover-value" id="hover-box"></div>
</div>
<p class="legend">Modèle basé sur ICON-CH1, corrigé par observations locales (Infoclimat + station personnelle) et topographie fine.</p>

<table id="tableau">
  <thead>
    <tr>
      <th data-key="lieu">Lieu</th>
      <th data-key="tn_prevue" class="sorted">TN prévue</th>
      <th data-key="tx_prevue">TX prévue</th>
    </tr>
  </thead>
  <tbody id="tableau-body">
    <tr><td colspan="3">Chargement du tableau…</td></tr>
  </tbody>
</table>

<script>
// ============================================================
// Dates dynamiques
// ============================================================
const moisFr = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const aujourd = new Date();
const demain = new Date(aujourd);
demain.setDate(demain.getDate() + 1);
document.getElementById('date-tn').textContent =
  `Nuit du ${aujourd.getDate()} au ${demain.getDate()} ${moisFr[demain.getMonth()]}`;
document.getElementById('date-tx').textContent =
  `Après-midi du ${demain.getDate()} ${moisFr[demain.getMonth()]}`;

const map = L.map('map').setView([44.95, 5.35], 10);
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  attribution: '&copy; OpenStreetMap contributors, SRTM | Style: &copy; OpenTopoMap'
}).addTo(map);

let overlayTN, overlayTX;
let grilleTN, grilleTX;
let isolignesLayer = null;
let coucheActive = 'tn';

fetch('bounds.json')
  .then(r => r.json())
  .then(bounds => {
    const bTN = [[bounds.tn.lat_min, bounds.tn.lon_min], [bounds.tn.lat_max, bounds.tn.lon_max]];
    const bTX = [[bounds.tx.lat_min, bounds.tx.lon_min], [bounds.tx.lat_max, bounds.tx.lon_max]];
    overlayTN = L.imageOverlay('carte_tn.png', bTN, {opacity: 0.75}).addTo(map);
    overlayTX = L.imageOverlay('carte_tx.png', bTX, {opacity: 0.75});
    map.fitBounds(bTN);
  });

// ============================================================
// Charger les grilles de valeurs (survol + isolignes)
// ============================================================
Promise.all([
  fetch('grille_tn.json').then(r => r.json()),
  fetch('grille_tx.json').then(r => r.json())
]).then(([gtn, gtx]) => {
  grilleTN = gtn;
  grilleTX = gtx;
  dessinerIsolignes();
});

function valeurGrille(grille, lat, lon) {
  const b = grille.bounds;
  if (lat < b.lat_min || lat > b.lat_max || lon < b.lon_min || lon > b.lon_max) return null;
  const col = Math.floor(((lon - b.lon_min) / (b.lon_max - b.lon_min)) * grille.width);
  const row = Math.floor(((b.lat_max - lat) / (b.lat_max - b.lat_min)) * grille.height);
  if (row < 0 || row >= grille.height || col < 0 || col >= grille.width) return null;
  return grille.values[row][col];
}

// Survol de la carte : afficher la valeur
const hoverBox = document.getElementById('hover-box');
map.on('mousemove', (e) => {
  const grille = coucheActive === 'tn' ? grilleTN : grilleTX;
  if (!grille) return;
  const v = valeurGrille(grille, e.latlng.lat, e.latlng.lng);
  if (v === null) {
    hoverBox.style.display = 'none';
  } else {
    hoverBox.style.display = 'block';
    hoverBox.textContent = `${v.toFixed(1)}°C`;
  }
});
map.on('mouseout', () => { hoverBox.style.display = 'none'; });

// ============================================================
// Isolignes tous les 1°C (calcul vectoriel via d3-contour)
// ============================================================
function gridToLatLng(x, y, grille) {
  const b = grille.bounds;
  const lon = b.lon_min + (x / grille.width) * (b.lon_max - b.lon_min);
  const lat = b.lat_max - (y / grille.height) * (b.lat_max - b.lat_min);
  return [lat, lon];
}

function dessinerIsolignes() {
  if (isolignesLayer) { map.removeLayer(isolignesLayer); }

  const grille = coucheActive === 'tn' ? grilleTN : grilleTX;
  if (!grille) return;

  const values = new Float64Array(grille.width * grille.height);
  let vmin = Infinity, vmax = -Infinity;
  for (let row = 0; row < grille.height; row++) {
    for (let col = 0; col < grille.width; col++) {
      const v = grille.values[row][col];
      const idx = row * grille.width + col;
      values[idx] = (v === null) ? NaN : v;
      if (v !== null) { if (v < vmin) vmin = v; if (v > vmax) vmax = v; }
    }
  }

  const seuils = [];
  for (let t = Math.ceil(vmin); t <= Math.floor(vmax); t += 1) seuils.push(t);

  const contourGen = d3.contours().size([grille.width, grille.height]).thresholds(seuils);
  const contours = contourGen(values);

  const groupe = L.layerGroup();

  contours.forEach(feature => {
    feature.coordinates.forEach(polygon => {
      polygon.forEach(ring => {
        const latlngs = ring.map(([x, y]) => gridToLatLng(x, y, grille));
        const isEntier = Math.round(feature.value) % 5 === 0;
        L.polyline(latlngs, {
          color: '#333', weight: isEntier ? 1.1 : 0.5,
          opacity: isEntier ? 0.55 : 0.3
        }).addTo(groupe);
      });
    });
  });

  isolignesLayer = groupe.addTo(map);
}

document.getElementById('btn-tn').addEventListener('click', () => {
  if (overlayTX && map.hasLayer(overlayTX)) map.removeLayer(overlayTX);
  if (overlayTN) overlayTN.addTo(map);
  document.getElementById('btn-tn').classList.add('active');
  document.getElementById('btn-tx').classList.remove('active');
  document.getElementById('date-tn').style.display = 'block';
  document.getElementById('date-tx').style.display = 'none';
  coucheActive = 'tn';
  dessinerIsolignes();
});

document.getElementById('btn-tx').addEventListener('click', () => {
  if (overlayTN && map.hasLayer(overlayTN)) map.removeLayer(overlayTN);
  if (overlayTX) overlayTX.addTo(map);
  document.getElementById('btn-tx').classList.add('active');
  document.getElementById('btn-tn').classList.remove('active');
  document.getElementById('date-tn').style.display = 'none';
  document.getElementById('date-tx').style.display = 'block';
  coucheActive = 'tx';
  dessinerIsolignes();
});

// Palette "Turbo" simplifiée (approximation par points de contrôle, interpolée)
const turboStops = [
  [0.00,[48,18,59]],[0.10,[70,84,190]],[0.20,[54,140,225]],[0.30,[38,188,196]],
  [0.40,[80,220,120]],[0.50,[170,230,60]],[0.60,[230,210,50]],[0.70,[250,150,40]],
  [0.80,[230,80,30]],[0.90,[170,30,30]],[1.00,[110,10,10]]
];
function turboColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < turboStops.length - 1; i++) {
    const [t0, c0] = turboStops[i], [t1, c1] = turboStops[i+1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0);
      const r = Math.round(c0[0] + f * (c1[0] - c0[0]));
      const g = Math.round(c0[1] + f * (c1[1] - c0[1]));
      const b = Math.round(c0[2] + f * (c1[2] - c0[2]));
      return `rgb(${r},${g},${b})`;
    }
  }
  return 'rgb(110,10,10)';
}

let tableauData = [];
let sortKey = 'tn_prevue';
let sortAsc = true;

function rendreTableau() {
  const tbody = document.getElementById('tableau-body');
  const tnVals = tableauData.map(d => d.tn_prevue);
  const txVals = tableauData.map(d => d.tx_prevue);
  const tnMin = Math.min(...tnVals), tnMax = Math.max(...tnVals);
  const txMin = Math.min(...txVals), txMax = Math.max(...txVals);

  const sorted = [...tableauData].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });

  tbody.innerHTML = '';
  sorted.forEach(row => {
    const tn_t = (row.tn_prevue - tnMin) / (tnMax - tnMin || 1);
    const tx_t = (row.tx_prevue - txMin) / (txMax - txMin || 1);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row.lieu}</td>
      <td class="temp" style="background:${turboColor(tn_t)}">${row.tn_prevue.toFixed(1)}°C</td>
      <td class="temp" style="background:${turboColor(tx_t)}">${row.tx_prevue.toFixed(1)}°C</td>`;
    tbody.appendChild(tr);
  });

  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  document.querySelector(`th[data-key="${sortKey}"]`).classList.add('sorted');
}

document.querySelectorAll('th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    rendreTableau();
  });
});

fetch('tableau_prevision.json')
  .then(r => r.json())
  .then(data => {
    tableauData = data;
    rendreTableau();
  })
  .catch(() => {
    document.getElementById('tableau-body').innerHTML = '<tr><td colspan="3">tableau_prevision.json introuvable</td></tr>';
  });

const dateInfo = document.getElementById('date-info');
dateInfo.textContent = "Généré le " + aujourd.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}) + " vers 18h30";
</script>

</body>
</html>
